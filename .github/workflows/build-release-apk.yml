name: Build and Release APK & AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release APK & App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove local AAPT2 override for CI runner
        run: |
          sed -i '/android\.aapt2FromMavenOverride/d' gradle.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"
            echo "KEYSTORE_FILE=${RUNNER_TEMP}/release.keystore" >> "$GITHUB_ENV"
            echo "Using release keystore from GitHub Secrets."
          else
            echo "KEYSTORE_BASE64 secret not set; falling back to debug signing key."
          fi

      - name: Build Release APK and App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Release APK and AAB artifacts
        id: meta
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)

          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "Error: No release APK found in app/build/outputs/apk/release"
            exit 1
          fi
          APK_NAME="MarkPad-v${VERSION_NAME}-release.apk"
          cp "$APK_SOURCE" "$APK_NAME"

          AAB_SOURCE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_SOURCE" ]; then
            echo "Error: No release AAB found in app/build/outputs/bundle/release"
            exit 1
          fi
          AAB_NAME="MarkPad-v${VERSION_NAME}-release.aab"
          cp "$AAB_SOURCE" "$AAB_NAME"

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "aab_name=${AAB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

      - name: Upload Release App Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.aab_name }}
          path: ${{ steps.meta.outputs.aab_name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}
          name: MarkPad v${{ steps.meta.outputs.version_name }} (Build ${{ steps.meta.outputs.version_code }})
          files: |
            ${{ steps.meta.outputs.apk_name }}
            ${{ steps.meta.outputs.aab_name }}
          generate_release_notes: true
          make_latest: true
